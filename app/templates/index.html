<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compilador Go: Léxico, Sintáctico, Semántico y Código Intermedio (IR)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --container-bg: rgba(22, 30, 49, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #00add8;
            --primary-hover: #0098bd;
            --primary-glow: rgba(0, 173, 216, 0.3);
            --secondary-color: #10b981;
            --secondary-hover: #059669;
            --semantic-color: #8b5cf6;
            --semantic-hover: #7c3aed;
            --ir-color: #f59e0b;
            --ir-hover: #d97706;
            --error-color: #ef4444;
            --error-bg: rgba(239, 68, 68, 0.12);
            --error-border: rgba(239, 68, 68, 0.35);
            --success-color: #10b981;
            --success-bg: rgba(16, 185, 129, 0.12);
            --success-border: rgba(16, 185, 129, 0.35);
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
            --mono-font: 'Fira Code', ui-monospace, SFMono-Regular, monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b0f19 75%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        main {
            width: 100%;
            max-width: 980px;
            padding: 2.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }

        .header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        h1 {
            font-weight: 800;
            margin: 0;
            font-size: 2.3rem;
            letter-spacing: -0.03em;
            color: #ffffff;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin: 0;
            max-width: 680px;
            line-height: 1.5;
        }

        .glass-panel {
            background: var(--container-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.75rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            transition: border-color 0.3s ease;
        }

        /* Editor con Números de Línea */
        .editor-wrapper {
            position: relative;
        }

        .editor-container {
            display: flex;
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            overflow: hidden;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            height: 260px;
        }

        .editor-container:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .line-numbers {
            background: rgba(255, 255, 255, 0.03);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            color: #64748b;
            font-family: var(--mono-font);
            font-size: 0.95rem;
            line-height: 1.6;
            padding: 1.25rem 0.75rem 1.25rem 1rem;
            text-align: right;
            user-select: none;
            overflow: hidden;
            white-space: pre-line;
            min-width: 3.4rem;
            box-sizing: border-box;
        }

        textarea {
            flex: 1;
            height: 100%;
            background: transparent;
            border: none;
            padding: 1.25rem 1.25rem 1.25rem 0.75rem;
            color: #f1f5f9;
            font-family: var(--mono-font);
            font-size: 0.95rem;
            line-height: 1.6;
            resize: none;
            box-sizing: border-box;
            tab-size: 4;
            overflow: auto;
            white-space: pre;
            word-break: normal;
        }

        textarea:focus {
            outline: none;
            box-shadow: none;
        }

        textarea::placeholder {
            color: #475569;
        }

        .button-group {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.25rem;
            flex-wrap: wrap;
        }

        button {
            display: inline-flex;
            flex: 1;
            min-width: 130px;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1rem;
            background: var(--primary-color);
            color: #0b0f19;
            border: none;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 173, 216, 0.3);
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 173, 216, 0.45);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary-btn {
            background: #10b981;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        button.secondary-btn:hover {
            background: #059669;
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.45);
        }

        button.semantic-btn {
            background: #8b5cf6;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        button.semantic-btn:hover {
            background: #7c3aed;
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.45);
        }

        button.ir-btn {
            background: #f59e0b;
            color: #0b0f19;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        button.ir-btn:hover {
            background: #d97706;
            color: #ffffff;
            box-shadow: 0 6px 16px rgba(245, 158, 11, 0.45);
        }

        button.optimize-btn {
            background: #6366f1;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        button.optimize-btn:hover {
            background: #4f46e5;
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.45);
        }

        .download-ir-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.45rem 0.9rem;
            background: #10b981;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
            min-width: auto;
            flex: 0 0 auto;
        }

        .download-ir-btn:hover {
            background: #059669;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.45);
        }

        button.outline-btn {
            background: transparent;
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.2);
            flex: 0 0 auto;
            min-width: 80px;
            box-shadow: none;
        }

        button.outline-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.35);
            color: #ffffff;
        }

        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            border-top-color: currentColor;
            animation: spin 0.8s linear infinite;
        }

        .loading .spinner {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Result Containers */
        #error-container {
            display: none;
            background-color: var(--error-bg);
            border: 1px solid var(--error-border);
            color: #fca5a5;
            padding: 1.25rem 1.5rem;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.6;
            animation: fadeIn 0.3s ease-out forwards;
        }

        #parse-result-container, #semantic-result-container, #ir-result-container, #optimization-result-container {
            display: none;
            animation: fadeIn 0.3s ease-out forwards;
            flex-direction: column;
            gap: 1.25rem;
        }

        .error-card {
            background-color: rgba(239, 68, 68, 0.08);
            border: 1px solid var(--error-border);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .error-card h3 {
            color: #f87171;
            margin: 0 0 0.5rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.15rem;
        }

        .success-card {
            background-color: rgba(16, 185, 129, 0.08);
            border: 1px solid var(--success-border);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .success-card h3 {
            color: #34d399;
            margin: 0 0 0.5rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.15rem;
        }

        .error-list {
            margin: 0.75rem 0 0 0;
            padding-left: 1.25rem;
            color: #fca5a5;
            font-family: var(--mono-font);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* AST Card & Viewer Styles */
        .ast-card, .ir-card {
            background: var(--container-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
        }

        .section-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .section-title {
            font-weight: 700;
            font-size: 1.15rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .ast-viewport {
            background: #070b14;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 1.5rem;
            overflow: auto;
            max-height: 550px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        #mermaid-render-area {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #mermaid-render-area svg {
            max-width: 100%;
            height: auto;
        }

        .code-snippet {
            display: flex;
            background: #090d16;
            border-radius: 8px;
            margin-top: 1rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .line-number {
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            color: #64748b;
            font-family: var(--mono-font);
            font-size: 0.9rem;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            user-select: none;
        }

        .code-line {
            padding: 0.75rem 1rem;
            font-family: var(--mono-font);
            font-size: 0.9rem;
            color: #f8fafc;
            white-space: pre-wrap;
            word-break: break-all;
            flex: 1;
        }

        .error-highlight {
            background-color: rgba(239, 68, 68, 0.4);
            border-bottom: 2px solid #ef4444;
            color: #fff;
            padding: 0 3px;
            border-radius: 3px;
            font-weight: bold;
        }

        /* Token Table, Symbols Table, Quadruples Table */
        #results-section, #symbols-section {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
            padding: 0;
            overflow: hidden;
        }

        .table-header-bar {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #ffffff;
        }

        .table-container {
            overflow-x: auto;
            max-height: 480px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background: rgba(11, 15, 25, 0.8);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 0.85rem 1.5rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            font-size: 0.78rem;
            letter-spacing: 0.06em;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 0.85rem 1.5rem;
            font-family: var(--mono-font);
            font-size: 0.9rem;
            color: #e2e8f0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        /* Insignias de tokens */
        .token-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            font-family: var(--mono-font);
        }

        .badge-keyword {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .badge-type {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-id {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .badge-literal {
            background: rgba(45, 212, 191, 0.15);
            color: #2dd4bf;
            border: 1px solid rgba(45, 212, 191, 0.3);
        }

        .badge-opar {
            background: rgba(244, 114, 182, 0.15);
            color: #f472b6;
            border: 1px solid rgba(244, 114, 182, 0.3);
        }

        .badge-oprel {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .badge-operator {
            background: rgba(129, 140, 248, 0.15);
            color: #818cf8;
            border: 1px solid rgba(129, 140, 248, 0.3);
        }

        .badge-delimiter {
            background: rgba(148, 163, 184, 0.15);
            color: #cbd5e1;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }

        .badge-scope {
            background: rgba(148, 163, 184, 0.12);
            color: #e2e8f0;
            border: 1px solid rgba(148, 163, 184, 0.25);
            font-family: var(--mono-font);
        }

        .badge-temp {
            background: rgba(245, 158, 11, 0.18);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.35);
        }

        .badge-label {
            background: rgba(236, 72, 153, 0.18);
            color: #f472b6;
            border: 1px solid rgba(236, 72, 153, 0.35);
        }

        /* TAC Code View Box */
        .tac-box {
            background: #060911;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            font-family: var(--mono-font);
            font-size: 0.95rem;
            line-height: 1.7;
            color: #f1f5f9;
            overflow-x: auto;
            white-space: pre;
        }

        .tac-box .tac-label {
            color: #f472b6;
            font-weight: 600;
        }

        .tac-box .tac-temp {
            color: #fbbf24;
        }

        .tac-box .tac-kw {
            color: #38bdf8;
            font-weight: 600;
        }

        .tac-box .tac-op {
            color: #818cf8;
        }

        /* Postfix Cards Grid */
        .postfix-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
        }

        .postfix-item {
            background: #070b14;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 1rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .postfix-infix {
            color: #94a3b8;
            font-size: 0.85rem;
            font-family: var(--mono-font);
        }

        .postfix-rpn {
            color: #2dd4bf;
            font-size: 1.05rem;
            font-weight: 600;
            font-family: var(--mono-font);
            letter-spacing: 0.04em;
        }

        /* Métricas y Visualización de Optimización U3 */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

        .metric-card {
            background: #090e1a;
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .metric-value {
            font-size: 1.85rem;
            font-weight: 800;
            color: #818cf8;
            font-family: var(--mono-font);
        }

        .metric-label {
            font-size: 0.88rem;
            color: #e2e8f0;
            font-weight: 600;
        }

        .metric-sub {
            font-size: 0.78rem;
            color: #94a3b8;
        }

        /* Estructura vertical para optimización */
        .cfg-vertical-stack {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            width: 100%;
        }

        .comparison-vertical-stack {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
        }

        .ast-viewport svg {
            max-width: 100%;
            height: auto;
        }

        .code-box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .code-box-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.95rem;
        }

        .code-box-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .copy-code-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #cbd5e1;
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .copy-code-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .copy-code-btn.copied {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border-color: rgba(16, 185, 129, 0.4);
        }

        /* Insignias temáticas de técnicas de optimización */
        .badge-folding {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .badge-propagation {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }

        .badge-cse {
            background: rgba(168, 85, 247, 0.2);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.4);
        }

        .badge-deadcode {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .badge-strength {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .badge-branch {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.4);
        }

        .opt-action-bar {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <main>
        <div class="header">
            <h1>Compilador Go</h1>
            <p class="subtitle">Analizador léxico, sintáctico, semántico, generador de código intermedio y optimizador (GFG)</p>
        </div>

        <div class="glass-panel">
            <div class="editor-wrapper">
                <div class="editor-container">
                    <div class="line-numbers" id="line-numbers">1</div>
                    <textarea id="code-input" placeholder="Escribe o pega código de Go aquí..." spellcheck="false"></textarea>
                </div>
            </div>

            <div class="button-group">
                <button id="analyze-btn" onclick="analyzeCode()">
                    <div class="spinner" id="lex-spinner"></div>
                    <span id="btn-text">Análisis léxico</span>
                </button>
                <button id="parse-btn" class="secondary-btn" onclick="analyzeSyntax()">
                    <div class="spinner" id="parse-spinner"></div>
                    <span id="parse-btn-text">Análisis sintáctico</span>
                </button>
                <button id="semantic-btn" class="semantic-btn" onclick="analyzeSemantic()">
                    <div class="spinner" id="semantic-spinner"></div>
                    <span id="semantic-btn-text">Análisis semántico</span>
                </button>
                <button id="ir-btn" class="ir-btn" onclick="analyzeIR()">
                    <div class="spinner" id="ir-spinner"></div>
                    <span id="ir-btn-text">Código intermedio (IR)</span>
                </button>
                <button id="optimize-btn" class="optimize-btn" onclick="analyzeOptimization()">
                    <div class="spinner" id="optimize-spinner"></div>
                    <span id="optimize-btn-text">Optimización</span>
                </button>

        <div id="error-container"></div>
        <div id="parse-result-container"></div>
        <div id="semantic-result-container"></div>

        <!-- Tabla de Tokens -->
        <div id="results-section" class="glass-panel">
            <div class="table-header-bar">
                <span class="table-title">Tokens identificados</span>

                <span class="table-title">Tabla de símbolos</span>

                <table>
                    <thead>
                        <tr>
                            <th>Identificador</th>
                            <th>Tipo</th>
                            <th>Ámbito</th>

    </main>

    <script>
        const textarea = document.getElementById('code-input');
        const lineNumbers = document.getElementById('line-numbers');

        function updateLineNumbers() {
            const lines = (textarea.value || '').split('\n').length;
            let numbersText = '';
            for (let i = 1; i <= Math.max(lines, 1); i++) {
                numbersText += i + '\n';
            }
            lineNumbers.textContent = numbersText;
        }

        function syncScroll() {
            lineNumbers.scrollTop = textarea.scrollTop;
        }

        textarea.addEventListener('input', updateLineNumbers);
        textarea.addEventListener('scroll', syncScroll);

        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
                updateLineNumbers();
            } else if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                analyzeSyntax();
            }
        });

        // Inicializar números de línea
        updateLineNumbers();

        // Inicializar Mermaid
        if (window.mermaid) {
            mermaid.initialize({
                startOnLoad: false,
                theme: 'dark',
                securityLevel: 'loose',
                flowchart: {
                    curve: 'basis',
                    useMaxWidth: false,
                    htmlLabels: true
                }
            });
        }

        function clearEditor() {
            textarea.value = '';
            updateLineNumbers();
            hideAllResults();
        }

        function hideAllResults() {
            document.getElementById('error-container').style.display = 'none';
            document.getElementById('results-section').style.display = 'none';
            document.getElementById('symbols-section').style.display = 'none';
            document.getElementById('parse-result-container').style.display = 'none';
            document.getElementById('semantic-result-container').style.display = 'none';
            document.getElementById('ir-result-container').style.display = 'none';
            document.getElementById('optimization-result-container').style.display = 'none';
            document.getElementById('results-body').innerHTML = '';
            document.getElementById('symbols-body').innerHTML = '';
        }

        function classifyToken(tokenName) {
            const name = (tokenName || '').toUpperCase();
            if (name === 'OPAR') return 'badge-opar';
            if (name === 'OPREL') return 'badge-oprel';
            if (name === 'TYPE') return 'badge-type';
            if (name === 'ID') return 'badge-id';
            if (['INT_LIT', 'FLOAT_LIT', 'STRING_LIT'].includes(name)) return 'badge-literal';
            if (['PACKAGE', 'IMPORT', 'FUNC', 'VAR', 'CONST', 'STRUCT', 'IF', 'ELSE', 'FOR', 'RETURN', 'TRUE', 'FALSE', 'NIL', 'TYPE_KW'].includes(name) || tokenName === 'type') return 'badge-keyword';
            if (['ASIGN', 'ASIGN_CORTA', 'ASSIGN', 'ASSIGN_DEF', 'AND', 'OR', 'INC', 'DEC', 'ADD_ASSIGN', 'SUB_ASSIGN', 'MUL_ASSIGN', 'DIV_ASSIGN'].includes(name)) return 'badge-operator';
            if (['DELIMITADOR', '(', ')', '{', '}', '[', ']', ',', ';', ':', '.', '!'].includes(tokenName) || name === 'DELIMITADOR') return 'badge-delimiter';
            return 'badge-keyword';
        }

        async function analyzeCode() {
            const codeInput = textarea.value;
            const analyzeBtn = document.getElementById('analyze-btn');
            
            if (!codeInput.trim()) {
                showError("El bloque de código no puede estar vacío.");
                return;
            }

            hideAllResults();
            analyzeBtn.classList.add('loading');
            document.getElementById('btn-text').textContent = 'Analizando...';

            try {
                const response = await fetch('/tokenize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: codeInput })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "Error al comunicarse con el servidor");
                }

                const data = await response.json();
                
                if (data.errors && data.errors.length > 0) {
                    showError("<b>Errores léxicos detectados:</b><br>" + data.errors.map(escapeHtml).join('<br>'));
                }

                if (data.tokens && data.tokens.length > 0) {
                    const resultsBody = document.getElementById('results-body');
                    data.tokens.forEach(token => {
                        const row = document.createElement('tr');
                        const badgeClass = classifyToken(token.token_name);
                        row.innerHTML = `
                            <td>${escapeHtml(token.lexeme)}</td>
                            <td><span class="token-badge ${badgeClass}">${escapeHtml(token.token_name)}</span></td>
                            <td>${escapeHtml(token.attribute_value)}</td>
                        `;
                        resultsBody.appendChild(row);
                    });
                    document.getElementById('results-section').style.display = 'block';
                } else if (!data.errors || data.errors.length === 0) {
                    showError("No se encontraron tokens válidos en el código.");
                }
            } catch (error) {
                showError(error.message);
            } finally {
                analyzeBtn.classList.remove('loading');
                document.getElementById('btn-text').textContent = 'Análisis léxico';
            }
        }

        async function analyzeSyntax() {
            const codeInput = textarea.value;
            const parseBtn = document.getElementById('parse-btn');
            
            if (!codeInput.trim()) {
                showError("El bloque de código no puede estar vacío.");
                return;
            }

            hideAllResults();
            parseBtn.classList.add('loading');
            document.getElementById('parse-btn-text').textContent = 'Analizando...';

            try {
                const response = await fetch('/parse', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: codeInput })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "Error al comunicarse con el servidor");
                }

                const data = await response.json();
                await displaySyntaxResult(data, codeInput);
                
            } catch (error) {
                showError(error.message);
            } finally {
                parseBtn.classList.remove('loading');
                document.getElementById('parse-btn-text').textContent = 'Análisis sintáctico';
            }
        }

        async function analyzeSemantic() {
            const codeInput = textarea.value;
            const semanticBtn = document.getElementById('semantic-btn');
            
            if (!codeInput.trim()) {
                showError("El bloque de código no puede estar vacío.");
                return;
            }

            hideAllResults();
            semanticBtn.classList.add('loading');
            document.getElementById('semantic-btn-text').textContent = 'Analizando...';

            try {
                const response = await fetch('/semantic', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: codeInput })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "Error al comunicarse con el servidor");
                }

                const data = await response.json();
                displaySemanticResult(data);
                
            } catch (error) {
                showError(error.message);
            } finally {
                semanticBtn.classList.remove('loading');
                document.getElementById('semantic-btn-text').textContent = 'Análisis semántico';
            }
        }

        async function analyzeIR() {
            const codeInput = textarea.value;
            const irBtn = document.getElementById('ir-btn');
            
            if (!codeInput.trim()) {
                showError("El bloque de código no puede estar vacío.");
                return;
            }

            hideAllResults();
            irBtn.classList.add('loading');
            document.getElementById('ir-btn-text').textContent = 'Generando...';

            try {
                const response = await fetch('/ir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },

                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "Error al comunicarse con el servidor");
                }

                const data = await response.json();
                displayIRResult(data);
                
            } catch (error) {
                showError(error.message);
            } finally {
                irBtn.classList.remove('loading');
                document.getElementById('ir-btn-text').textContent = 'Código intermedio (IR)';
            }
        }

        async function displaySyntaxResult(data, originalCode) {
            const container = document.getElementById('parse-result-container');
            container.style.display = 'flex';
            container.innerHTML = '';
            
            if (data.success) {
                const successDiv = document.createElement('div');
                successDiv.className = 'success-card';
                successDiv.innerHTML = `
                    <h3>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
                        Sintaxis correcta
                    </h3>
                    <p style="margin:0; color:#cbd5e1;">El bloque de código introducido es estructuralmente válido.</p>
                `;
                container.appendChild(successDiv);

                if (data.ast_mermaid) {
                    const astCard = document.createElement('div');
                    astCard.className = 'ast-card';
                    astCard.innerHTML = `
                        <div class="section-header-bar">
                            <div class="section-title">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00add8" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                                Árbol sintáctico
                            </div>
                        </div>
                        <div class="ast-viewport">
                            <div id="mermaid-render-area"></div>
                        </div>
                    `;
                    container.appendChild(astCard);

                    if (window.mermaid) {
                        try {
                            const renderArea = document.getElementById('mermaid-render-area');
                            const uniqueId = 'mermaid-graph-' + Date.now();
                            const { svg } = await mermaid.render(uniqueId, data.ast_mermaid);
                            renderArea.innerHTML = svg;
                        } catch (err) {
                            console.error("Error al renderizar Mermaid:", err);
                        }
                    }
                }
            } else {
                let codeSnippetHtml = '';
                if (data.error_line !== null && data.error_index !== null) {
                    const lines = originalCode.split('\n');
                    const errLineText = lines[data.error_line - 1] || '';
                    
                    let absIndex = data.error_index;
                    let currentIdx = 0;
                    let col = 0;
                    for (let i = 0; i < lines.length; i++) {
                        if (currentIdx + lines[i].length >= absIndex) {
                            col = absIndex - currentIdx;
                            break;
                        }
                        currentIdx += lines[i].length + 1;
                    }
                    
                    let errTokenLength = 1;
                    const match = (data.error_message || '').match(/cerca de '([^']+)'/);
                    if (match && match[1]) {
                        errTokenLength = Math.max(match[1].length, 1);
                    }

                    const before = errLineText.substring(0, col);
                    const errToken = errLineText.substring(col, col + errTokenLength) || ' ';
                    const after = errLineText.substring(col + errToken.length);
                    
                    codeSnippetHtml = `
                        <div class="code-snippet">
                            <div class="line-number">Línea ${data.error_line}</div>
                            <div class="code-line">${escapeHtml(before)}<mark class="error-highlight">${escapeHtml(errToken)}</mark>${escapeHtml(after)}</div>
                        </div>
                    `;
                }

                container.innerHTML = `
                    <div class="error-card">
                        <h3>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            Error de sintaxis
                        </h3>
                        <p style="margin:0; color:#cbd5e1;">${escapeHtml(data.error_message)}</p>
                        ${codeSnippetHtml}
                    </div>
                `;
            }
        }

        function displaySemanticResult(data) {
            const container = document.getElementById('semantic-result-container');
            container.style.display = 'flex';
            container.innerHTML = '';
            
            if (data.success) {
                const successDiv = document.createElement('div');
                successDiv.className = 'success-card';
                successDiv.innerHTML = `
                    <h3>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
                        Semántica correcta
                    </h3>
                    <p style="margin:0; color:#cbd5e1;">No se encontraron errores de tipo, redeclaración ni variables no declaradas.</p>
                `;
                container.appendChild(successDiv);

                if (data.symbols && data.symbols.length > 0) {
                    const symbolsBody = document.getElementById('symbols-body');
                    symbolsBody.innerHTML = '';
                    data.symbols.forEach(sym => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td style="font-weight: 600; color: #ffffff;">${escapeHtml(sym.name)}</td>
                            <td><span class="token-badge badge-type">${escapeHtml(sym.data_type)}</span></td>
                            <td><span class="token-badge badge-scope">${escapeHtml(sym.scope)}</span></td>
                            <td style="color: #94a3b8; font-family: var(--mono-font);">${sym.line !== null && sym.line !== undefined ? sym.line : '-'}</td>
                        `;
                        symbolsBody.appendChild(row);
                    });
                    document.getElementById('symbols-section').style.display = 'block';
                }
            } else {
                let errorItemsHtml = '';
                if (data.errors && data.errors.length > 0) {
                    errorItemsHtml = `<ul class="error-list">` + data.errors.map(err => `<li>${escapeHtml(err)}</li>`).join('') + `</ul>`;
                }

                container.innerHTML = `
                    <div class="error-card">
                        <h3>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            Error semántico detectado
                        </h3>
                        <p style="margin:0; color:#cbd5e1;">Se encontraron errores semánticos en las declaraciones o uso de identificadores:</p>
                        ${errorItemsHtml}
                    </div>
                `;
            }
        }

        function highlightTac(code) {
            return escapeHtml(code)
                .replace(/\b(func|endfunc|goto|ifFalse|ifTrue|param|call|return)\b/g, '<span class="tac-kw">$1</span>')
                .replace(/\b(L\d+):/g, '<span class="tac-label">$1:</span>')
                .replace(/\b(L\d+)\b/g, '<span class="tac-label">$1</span>')
                .replace(/\b(t\d+)\b/g, '<span class="tac-temp">$1</span>');
        }

        let lastIRData = null;

        function displayIRResult(data) {
            lastIRData = data;
            const container = document.getElementById('ir-result-container');
            container.style.display = 'flex';
            container.innerHTML = '';

            if (data.success) {
                const successDiv = document.createElement('div');
                successDiv.className = 'success-card';
                successDiv.innerHTML = `
                    <h3>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
                        Código intermedio generado
                    </h3>
                    <p style="margin:0; color:#cbd5e1;">Se ha generado la representación intermedia en formatos: código de tres direcciones (TAC), cuádruplos/triplos y notación postfija</p>
                `;
                container.appendChild(successDiv);

                // 1. Panel de Código de Tres Direcciones (TAC)
                const tacCard = document.createElement('div');
                tacCard.className = 'ir-card';
                tacCard.innerHTML = `
                    <div class="section-header-bar">
                        <div class="section-title">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            Código de tres direcciones (TAC)
                        </div>
                    </div>
                    <div class="tac-box">${highlightTac(data.tac_code || '')}</div>
                `;
                container.appendChild(tacCard);

                // 2. Tabla de Cuádruplos y Triplos
                if (data.quadruples && data.quadruples.length > 0) {
                    const quadsCard = document.createElement('div');
                    quadsCard.className = 'ir-card';
                    
                    let rowsHtml = '';
                    data.quadruples.forEach(q => {
                        let opBadge = `<span class="token-badge badge-operator">${escapeHtml(q.op)}</span>`;
                        let resBadge = q.result.startsWith('t') ? `<span class="token-badge badge-temp">${escapeHtml(q.result)}</span>` : 
                                      (q.result.startsWith('L') ? `<span class="token-badge badge-label">${escapeHtml(q.result)}</span>` : escapeHtml(q.result));
                        
                        rowsHtml += `
                            <tr>
                                <td style="color: #94a3b8; font-weight: 600;">#${q.index}</td>
                                <td>${opBadge}</td>
                                <td>${escapeHtml(q.arg1 || '-')}</td>
                                <td>${escapeHtml(q.arg2 || '-')}</td>
                                <td>${resBadge || '-'}</td>
                            </tr>
                        `;
                    });

                    quadsCard.innerHTML = `
                        <div class="section-header-bar">
                            <div class="section-title">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00add8" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"/></svg>
                                Tabla de cuádruplos y triplos (#, op, arg1, arg2, res)
                            </div>
                            <button id="download-ir-btn" class="download-ir-btn" onclick="downloadIRFile()" title="Guardar archivo .ir">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                                <span>Guardar archivo .ir</span>
                            </button>
                        </div>
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Operador</th>
                                        <th>Argumento 1</th>
                                        <th>Argumento 2</th>
                                        <th>Resultado</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rowsHtml}
                                </tbody>
                            </table>
                        </div>
                    `;
                    container.appendChild(quadsCard);
                }

                // 3. Panel de Notación Postfija (RPN)
                if (data.postfix_expressions && data.postfix_expressions.length > 0) {
                    const postCard = document.createElement('div');
                    postCard.className = 'ir-card';
                    
                    let postGridHtml = '';
                    data.postfix_expressions.forEach(p => {
                        postGridHtml += `
                            <div class="postfix-item">
                                <span class="postfix-infix">Infija: ${escapeHtml(p.infix)}</span>
                                <span class="postfix-rpn">Postfija: ${escapeHtml(p.postfix)}</span>
                            </div>
                        `;
                    });

                    postCard.innerHTML = `
                        <div class="section-header-bar">
                            <div class="section-title">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                                Notación postfija (recorrido postorden del AST)
                            </div>
                        </div>
                        <div class="postfix-grid">
                            ${postGridHtml}
                        </div>
                    `;
                    container.appendChild(postCard);
                }

            } else {
                let errorItemsHtml = '';
                if (data.errors && data.errors.length > 0) {
                    errorItemsHtml = `<ul class="error-list">` + data.errors.map(err => `<li>${escapeHtml(err)}</li>`).join('') + `</ul>`;
                }

                container.innerHTML = `
                    <div class="error-card">
                        <h3>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            No se pudo generar el código intermedio
                        </h3>
                        <p style="margin:0; color:#cbd5e1;">El código presenta inconsistencias que deben corregirse antes de generar la representación intermedia:</p>
                        ${errorItemsHtml}
                    </div>
                `;
            }
        }

        function downloadIRFile() {
            if (!lastIRData || !lastIRData.triples || lastIRData.triples.length === 0) {
                showError("No hay código intermedio generado para guardar.");
                return;
            }
            const content = lastIRData.triples.join('\n') + '\n';
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'programa.ir';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        let lastOptData = null;

        async function analyzeOptimization() {
            const codeInput = textarea.value;
            const optBtn = document.getElementById('optimize-btn');
            
            if (!codeInput.trim()) {
                showError("El bloque de código no puede estar vacío.");
                return;
            }

            hideAllResults();
            optBtn.classList.add('loading');
            document.getElementById('optimize-btn-text').textContent = 'Optimizando...';

            try {
                const response = await fetch('/optimize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: codeInput })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "Error al comunicarse con el servidor");
                }

                const data = await response.json();
                await displayOptimizationResult(data);
                
            } catch (error) {
                showError(error.message);
            } finally {
                optBtn.classList.remove('loading');
                document.getElementById('optimize-btn-text').textContent = 'Optimización';
            }
        }

        async function displayOptimizationResult(data) {
            lastOptData = data;
            const container = document.getElementById('optimization-result-container');
            container.style.display = 'flex';
            container.innerHTML = '';

            if (data.success) {
                const successDiv = document.createElement('div');
                successDiv.className = 'success-card';
                successDiv.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                        <div>
                            <h3>
                                <!-- <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg> -->
                                Optimización completada usando GFG
                            </h3>
                            <p style="margin:0; color:#cbd5e1;">Se analizaron los bloques básicos, se construyó el GFG y se aplicaron las técnicas de optimización</p>
                        </div>
                        <div class="opt-action-bar">
                            <button class="download-ir-btn" onclick="downloadBeforeIR()" title="Descargar antes.ir">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                                <span>Descargar antes.ir</span>
                            </button>
                            <button class="download-ir-btn" style="background:#6366f1;" onclick="downloadAfterIR()" title="Descargar despues.ir">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                                <span>Descargar despues.ir</span>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(successDiv);

                // Tarjetas de Métricas
                const m = data.metrics;
                const metricsDiv = document.createElement('div');
                metricsDiv.className = 'metrics-grid';
                metricsDiv.innerHTML = `
                    <div class="metric-card">
                        <div class="metric-value">${m.reduction_percent}%</div>
                        <div class="metric-label">Reducción de código</div>
                        <div class="metric-sub">${m.total_instructions_before} → ${m.total_instructions_after} instrucciones</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">${m.total_instructions_before - m.total_instructions_after}</div>
                        <div class="metric-label">Instrucciones eliminadas</div>
                        <div class="metric-sub">Poda de código muerto e inalcanzable</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">${m.temporals_saved}</div>
                        <div class="metric-label">Temporales ahorrados</div>
                        <div class="metric-sub">Reutilización y plegado</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-value">${m.cyclomatic_complexity_before} → ${m.cyclomatic_complexity_after}</div>
                        <div class="metric-label">Complejidad ciclomática</div>
                        <div class="metric-sub">${m.blocks_before} → ${m.blocks_after} bloques básicos</div>
                    </div>
                `;
                container.appendChild(metricsDiv);

                // 1. Grafo de Flujo de Control (GFG) Original
                const cfgBeforeCard = document.createElement('div');
                cfgBeforeCard.className = 'ast-card';
                cfgBeforeCard.innerHTML = `
                    <div class="section-header-bar">
                        <div class="section-title">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8m-4-4h8"/></svg>
                            Grafo de flujo de control (GFG) original
                        </div>
                        <div>
                            <span class="token-badge badge-temp">${m.blocks_before} bloques básicos</span>
                        </div>
                    </div>
                    <div class="ast-viewport">
                        <div id="mermaid-cfg-before" style="width:100%; display:flex; justify-content:center;"></div>
                    </div>
                `;
                container.appendChild(cfgBeforeCard);

                // 2. Grafo de Flujo de Control (GFG) Optimizado
                const cfgAfterCard = document.createElement('div');
                cfgAfterCard.className = 'ast-card';
                cfgAfterCard.innerHTML = `
                    <div class="section-header-bar">
                        <div class="section-title">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            Grafo de flujo de control (GFG) optimizado
                        </div>
                        <div>
                            <span class="token-badge badge-type">${m.blocks_after} bloques activos</span>
                        </div>
                    </div>
                    <div class="ast-viewport">
                        <div id="mermaid-cfg-after" style="width:100%; display:flex; justify-content:center;"></div>
                    </div>
                `;
                container.appendChild(cfgAfterCard);

                if (window.mermaid) {
                    try {
                        const areaBefore = document.getElementById('mermaid-cfg-before');
                        const idBefore = 'cfg-before-' + Date.now();
                        const resBefore = await mermaid.render(idBefore, data.original_cfg_mermaid);
                        areaBefore.innerHTML = resBefore.svg;

                        const areaAfter = document.getElementById('mermaid-cfg-after');
                        const idAfter = 'cfg-after-' + (Date.now() + 1);
                        const resAfter = await mermaid.render(idAfter, data.optimized_cfg_mermaid);
                        areaAfter.innerHTML = resAfter.svg;
                    } catch (err) {
                        console.error("Error al renderizar Mermaid CFG:", err);
                    }
                }

                // 3. Tabla de Bloques Básicos y Sucesores
                if (data.blocks_before && data.blocks_before.length > 0) {
                    const bbCard = document.createElement('div');
                    bbCard.className = 'ir-card';
                    let bbRows = '';
                    data.blocks_before.forEach(b => {
                        const statusBadge = b.is_unreachable 
                            ? `<span class="token-badge badge-deadcode">Inalcanzable</span>`
                            : `<span class="token-badge badge-type">Alcanzable</span>`;
                        const instText = b.instructions.map(escapeHtml).join('<br/>');
                        const succText = b.successors.length > 0 ? b.successors.join(', ') : 'Fin';
                        bbRows += `
                            <tr>
                                <td style="font-weight:700; color:#38bdf8;">${escapeHtml(b.id)}</td>
                                <td>${statusBadge}</td>
                                <td style="font-family:var(--mono-font); font-size:0.85rem; line-height:1.5;">${instText}</td>
                                <td style="color:#fbbf24; font-weight:600;">${escapeHtml(succText)}</td>
                            </tr>
                        `;
                    });
                    bbCard.innerHTML = `
                        <div class="section-header-bar">
                            <div class="section-title">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
                                Identificación de bloques básicos y tabla de sucesores
                            </div>
                        </div>
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th style="width: 100px;">Bloque</th>
                                        <th style="width: 140px;">Estado</th>
                                        <th>Instrucciones TAC</th>
                                        <th style="width: 140px;">Sucesores</th>
                                    </tr>
                                </thead>
                                <tbody>${bbRows}</tbody>
                            </table>
                        </div>
                    `;
                    container.appendChild(bbCard);
                }

                // 4. Tabla de Transformaciones
                if (data.transformations && data.transformations.length > 0) {
                    const transCard = document.createElement('div');
                    transCard.className = 'ir-card';
                    let transRows = '';
                    data.transformations.forEach(t => {
                        const badgeCls = getTechniqueBadgeClass(t.technique);
                        transRows += `
                            <tr>
                                <td style="font-weight:700; color:#cbd5e1;">#${t.step}</td>
                                <td><span class="token-badge badge-scope">${escapeHtml(t.block_id)}</span></td>
                                <td><span class="token-badge ${badgeCls}">${escapeHtml(t.technique)}</span></td>
                                <td style="font-family:var(--mono-font); color:#f87171; font-size:0.85rem;">${escapeHtml(t.original_code)}</td>
                                <td style="font-family:var(--mono-font); color:#34d399; font-size:0.85rem;">${escapeHtml(t.optimized_code)}</td>
                                <td style="color:#cbd5e1; font-size:0.85rem; line-height:1.5;">${escapeHtml(t.justification)}</td>
                            </tr>
                        `;
                    });
                    transCard.innerHTML = `
                        <div class="section-header-bar">
                            <div class="section-title">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                                Tabla de transformaciones aplicadas
                            </div>
                        </div>
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th style="width:70px;">Paso</th>
                                        <th style="width:90px;">Bloque</th>
                                        <th style="width:200px;">Técnica</th>
                                        <th>Código original</th>
                                        <th>Código optimizado</th>
                                        <th>Justificación técnica</th>
                                    </tr>
                                </thead>
                                <tbody>${transRows}</tbody>
                            </table>
                        </div>
                    `;
                    container.appendChild(transCard);
                }

                // 5. Comparativa de Código de Tres Direcciones (TAC)
                const tacCard = document.createElement('div');
                tacCard.className = 'ir-card';
                tacCard.innerHTML = `
                    <div class="section-header-bar">
                        <div class="section-title">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                            Comparativa de código de tres direcciones (TAC)
                        </div>
                    </div>
                    <div class="comparison-vertical-stack">
                        <div>
                            <div class="code-box-header">
                                <div class="code-box-title">
                                    <span class="token-badge badge-deadcode">TAC original</span>
                                    <span style="font-weight:600; color:#f87171;">Código de tres direcciones original</span>
                                    <span style="color:#94a3b8; font-size:0.82rem;">(${m.total_instructions_before} instrucciones)</span>
                                </div>
                                <div class="code-box-actions">
                                    <button class="copy-code-btn" onclick="copyOriginalTAC(this)" title="Copiar TAC original">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg>
                                        <span>Copiar TAC original</span>
                                    </button>
                                </div>
                            </div>
                            <div class="tac-box" style="border-color:rgba(239,68,68,0.35); max-height:420px; overflow-y:auto;">${escapeHtml(data.original_tac)}</div>
                        </div>

                        <div>
                            <div class="code-box-header">
                                <div class="code-box-title">
                                    <span class="token-badge badge-strength">TAC optimizado</span>
                                    <span style="font-weight:600; color:#34d399;">Código de tres direcciones optimizado</span>
                                    <span style="color:#94a3b8; font-size:0.82rem;">(${m.total_instructions_after} instrucciones)</span>
                                </div>
                                <div class="code-box-actions">
                                    <button class="copy-code-btn" onclick="copyOptimizedTAC(this)" title="Copiar TAC optimizado">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg>
                                        <span>Copiar TAC optimizado</span>
                                    </button>
                                </div>
                            </div>
                            <div class="tac-box" style="border-color:rgba(16,185,129,0.35); max-height:420px; overflow-y:auto;">${escapeHtml(data.optimized_tac)}</div>
                        </div>
                    </div>
                `;
                container.appendChild(tacCard);

                // 6. Comparador de Código IR Formato Tripletas/Cuádruplos
                const irCompCard = document.createElement('div');
                irCompCard.className = 'ir-card';
                irCompCard.innerHTML = `
                    <div class="section-header-bar">
                        <div class="section-title">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                            Comparativa de código intermedio formato .ir (tripletas)
                        </div>
                    </div>
                    <div class="comparison-vertical-stack">
                        <div>
                            <div class="code-box-header">
                                <div class="code-box-title">
                                    <span class="token-badge badge-deadcode">antes.ir</span>
                                    <span style="font-weight:600; color:#f87171;">Código intermedio original (.ir)</span>
                                    <span style="color:#94a3b8; font-size:0.82rem;">(${m.total_instructions_before} instrucciones)</span>
                                </div>
                                <div class="code-box-actions">
                                    <button class="copy-code-btn" onclick="copyOriginalIR(this)" title="Copiar antes.ir">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg>
                                        <span>Copiar</span>
                                    </button>
                                    <button class="copy-code-btn" onclick="downloadBeforeIR()" title="Descargar antes.ir">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                                        <span>Descargar antes.ir</span>
                                    </button>
                                </div>
                            </div>
                            <div class="tac-box" style="border-color:rgba(239,68,68,0.35); max-height:420px; overflow-y:auto;">${escapeHtml(data.original_ir)}</div>
                        </div>

                        <div>
                            <div class="code-box-header">
                                <div class="code-box-title">
                                    <span class="token-badge badge-strength">despues.ir</span>
                                    <span style="font-weight:600; color:#34d399;">Código intermedio optimizado (.ir)</span>
                                    <span style="color:#94a3b8; font-size:0.82rem;">(${m.total_instructions_after} instrucciones)</span>
                                </div>
                                <div class="code-box-actions">
                                    <button class="copy-code-btn" onclick="copyOptimizedIR(this)" title="Copiar despues.ir">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path></svg>
                                        <span>Copiar</span>
                                    </button>
                                    <button class="copy-code-btn" onclick="downloadAfterIR()" title="Descargar despues.ir">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                                        <span>Descargar despues.ir</span>
                                    </button>
                                </div>
                            </div>
                            <div class="tac-box" style="border-color:rgba(16,185,129,0.35); max-height:420px; overflow-y:auto;">${escapeHtml(data.optimized_ir)}</div>
                        </div>
                    </div>
                `;
                container.appendChild(irCompCard);

            } else {
                let errorItemsHtml = '';
                if (data.errors && data.errors.length > 0) {
                    errorItemsHtml = `<ul class="error-list">` + data.errors.map(err => `<li>${escapeHtml(err)}</li>`).join('') + `</ul>`;
                }

                container.innerHTML = `
                    <div class="error-card">
                        <h3>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            No se pudo realizar la optimización
                        </h3>
                        <p style="margin:0; color:#cbd5e1;">El código presenta errores que deben corregirse antes de optimizar:</p>
                        ${errorItemsHtml}
                    </div>
                `;
            }
        }

        function getTechniqueBadgeClass(technique) {
            const t = (technique || '').toLowerCase();
            if (t.includes('folding') || t.includes('plegado')) return 'badge-folding';
            if (t.includes('propagación')) return 'badge-propagation';
            if (t.includes('subexpresiones') || t.includes('cse')) return 'badge-cse';
            if (t.includes('muerto') || t.includes('dead')) return 'badge-deadcode';
            if (t.includes('inalcanzable')) return 'badge-deadcode';
            if (t.includes('fuerza')) return 'badge-strength';
            if (t.includes('salto') || t.includes('bifurcación')) return 'badge-branch';
            return 'badge-scope';
        }

        function copyCodeToClipboard(text, btn) {
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                const origHtml = btn.innerHTML;
                btn.classList.add('copied');
                btn.innerHTML = `
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    <span>¡Copiado!</span>
                `;
                setTimeout(() => {
                    btn.innerHTML = origHtml;
                    btn.classList.remove('copied');
                }, 1800);
            }).catch(err => {
                console.error("Error al copiar al portapapeles:", err);
            });
        }

        function copyOriginalTAC(btn) {
            if (lastOptData && lastOptData.original_tac) {
                copyCodeToClipboard(lastOptData.original_tac, btn);
            }
        }

        function copyOptimizedTAC(btn) {
            if (lastOptData && lastOptData.optimized_tac) {
                copyCodeToClipboard(lastOptData.optimized_tac, btn);
            }
        }

        function copyOriginalIR(btn) {
            if (lastOptData && lastOptData.original_ir) {
                copyCodeToClipboard(lastOptData.original_ir, btn);
            }
        }

        function copyOptimizedIR(btn) {
            if (lastOptData && lastOptData.optimized_ir) {
                copyCodeToClipboard(lastOptData.optimized_ir, btn);
            }
        }

        function downloadBeforeIR() {
            if (!lastOptData || !lastOptData.original_ir) {
                showError("No hay código original disponible para descargar.");
                return;
            }
            const blob = new Blob([lastOptData.original_ir], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'antes.ir';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function downloadAfterIR() {
            if (!lastOptData || !lastOptData.optimized_ir) {
                showError("No hay código optimizado disponible para descargar.");
                return;
            }
            const blob = new Blob([lastOptData.optimized_ir], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'despues.ir';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function showError(message) {
             const errorContainer = document.getElementById('error-container');
             errorContainer.innerHTML = message;
             errorContainer.style.display = 'block';
        }

        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }
    </script>
</body>
