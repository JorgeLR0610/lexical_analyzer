<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compilador Go: Léxico, Sintáctico, Semántico y Código Intermedio (IR)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --container-bg: rgba(22, 30, 49, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #00add8;
            --primary-hover: #0098bd;
            --primary-glow: rgba(0, 173, 216, 0.3);
            --secondary-color: #10b981;
            --secondary-hover: #059669;
            --semantic-color: #8b5cf6;
            --semantic-hover: #7c3aed;
            --ir-color: #f59e0b;
            --ir-hover: #d97706;
            --error-color: #ef4444;
            --error-bg: rgba(239, 68, 68, 0.12);
            --error-border: rgba(239, 68, 68, 0.35);
            --success-color: #10b981;
            --success-bg: rgba(16, 185, 129, 0.12);
            --success-border: rgba(16, 185, 129, 0.35);
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
            --mono-font: 'Fira Code', ui-monospace, SFMono-Regular, monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b0f19 75%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        main {
            width: 100%;
            max-width: 980px;
            padding: 2.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }

        .header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        h1 {
            font-weight: 800;
            margin: 0;
            font-size: 2.3rem;
            letter-spacing: -0.03em;
            color: #ffffff;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin: 0;
            max-width: 680px;
            line-height: 1.5;
        }

        .glass-panel {
            background: var(--container-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.75rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            transition: border-color 0.3s ease;
        }

        /* Editor con Números de Línea */
        .editor-wrapper {
            position: relative;
        }

        .editor-container {
            display: flex;
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            overflow: hidden;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            height: 260px;
        }

        .editor-container:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .line-numbers {
            background: rgba(255, 255, 255, 0.03);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            color: #64748b;
            font-family: var(--mono-font);
            font-size: 0.95rem;
            line-height: 1.6;
            padding: 1.25rem 0.75rem 1.25rem 1rem;
            text-align: right;
            user-select: none;
            overflow: hidden;
            white-space: pre-line;
            min-width: 3.4rem;
            box-sizing: border-box;
        }

        textarea {
            flex: 1;
            height: 100%;
            background: transparent;
            border: none;
            padding: 1.25rem 1.25rem 1.25rem 0.75rem;
            color: #f1f5f9;
            font-family: var(--mono-font);
            font-size: 0.95rem;
            line-height: 1.6;
            resize: none;
            box-sizing: border-box;
            tab-size: 4;
            overflow: auto;
            white-space: pre;
            word-break: normal;
        }

        textarea:focus {
            outline: none;
            box-shadow: none;
        }

        textarea::placeholder {
            color: #475569;
        }

        .button-group {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.25rem;
            flex-wrap: wrap;
        }

        button {
            display: inline-flex;
            flex: 1;
            min-width: 130px;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1rem;
            background: var(--primary-color);
            color: #0b0f19;
            border: none;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 173, 216, 0.3);
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 173, 216, 0.45);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary-btn {
            background: #10b981;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        button.secondary-btn:hover {
            background: #059669;
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.45);
        }

        button.semantic-btn {
            background: #8b5cf6;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        button.semantic-btn:hover {
            background: #7c3aed;
            box-shadow: 0 6px 16px rgba(139, 92, 246, 0.45);
        }

        button.ir-btn {
            background: #f59e0b;
            color: #0b0f19;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        button.ir-btn:hover {
            background: #d97706;
            color: #ffffff;
            box-shadow: 0 6px 16px rgba(245, 158, 11, 0.45);
        }

        button.outline-btn {
            background: transparent;
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.2);
            flex: 0 0 auto;
            min-width: 80px;
            box-shadow: none;
        }

        button.outline-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.35);
            color: #ffffff;
        }

        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-radius: 50%;
            border-top-color: currentColor;
            animation: spin 0.8s linear infinite;
        }

        .loading .spinner {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Result Containers */
        #error-container {
            display: none;
            background-color: var(--error-bg);
            border: 1px solid var(--error-border);
            color: #fca5a5;
            padding: 1.25rem 1.5rem;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.6;
            animation: fadeIn 0.3s ease-out forwards;
        }

        #parse-result-container, #semantic-result-container, #ir-result-container {
            display: none;
            animation: fadeIn 0.3s ease-out forwards;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .error-card {
            background-color: rgba(239, 68, 68, 0.08);
            border: 1px solid var(--error-border);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .error-card h3 {
            color: #f87171;
            margin: 0 0 0.5rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.15rem;
        }

        .success-card {
            background-color: rgba(16, 185, 129, 0.08);
            border: 1px solid var(--success-border);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .success-card h3 {
            color: #34d399;
            margin: 0 0 0.5rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.15rem;
        }

        .error-list {
            margin: 0.75rem 0 0 0;
            padding-left: 1.25rem;
            color: #fca5a5;
            font-family: var(--mono-font);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* AST Card & Viewer Styles */
        .ast-card, .ir-card {
            background: var(--container-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
        }

        .section-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }

        .section-title {
            font-weight: 700;
            font-size: 1.15rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .ast-viewport {
            background: #070b14;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 1.5rem;
            overflow: auto;
            max-height: 550px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        #mermaid-render-area {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #mermaid-render-area svg {
            max-width: 100%;
            height: auto;
        }

        .code-snippet {
            display: flex;
            background: #090d16;
            border-radius: 8px;
            margin-top: 1rem;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .line-number {
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            color: #64748b;
            font-family: var(--mono-font);
            font-size: 0.9rem;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            user-select: none;
        }

        .code-line {
            padding: 0.75rem 1rem;
            font-family: var(--mono-font);
            font-size: 0.9rem;
            color: #f8fafc;
            white-space: pre-wrap;
            word-break: break-all;
            flex: 1;
        }

        .error-highlight {
            background-color: rgba(239, 68, 68, 0.4);
            border-bottom: 2px solid #ef4444;
            color: #fff;
            padding: 0 3px;
            border-radius: 3px;
            font-weight: bold;
        }

        /* Token Table, Symbols Table, Quadruples Table */
        #results-section, #symbols-section {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
            padding: 0;
            overflow: hidden;
        }

        .table-header-bar {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .table-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #ffffff;
        }

        .table-container {
            overflow-x: auto;
            max-height: 480px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background: rgba(11, 15, 25, 0.8);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 0.85rem 1.5rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            font-size: 0.78rem;
            letter-spacing: 0.06em;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 0.85rem 1.5rem;
            font-family: var(--mono-font);
            font-size: 0.9rem;
            color: #e2e8f0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        /* Insignias de tokens */
        .token-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            font-family: var(--mono-font);
        }

        .badge-keyword {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .badge-type {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-id {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .badge-literal {
            background: rgba(45, 212, 191, 0.15);
            color: #2dd4bf;
            border: 1px solid rgba(45, 212, 191, 0.3);
        }

        .badge-opar {
            background: rgba(244, 114, 182, 0.15);
            color: #f472b6;
            border: 1px solid rgba(244, 114, 182, 0.3);
        }

        .badge-oprel {
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .badge-operator {
            background: rgba(129, 140, 248, 0.15);
            color: #818cf8;
            border: 1px solid rgba(129, 140, 248, 0.3);
        }

        .badge-delimiter {
            background: rgba(148, 163, 184, 0.15);
            color: #cbd5e1;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }

        .badge-scope {
            background: rgba(148, 163, 184, 0.12);
            color: #e2e8f0;
            border: 1px solid rgba(148, 163, 184, 0.25);
            font-family: var(--mono-font);
        }

        .badge-temp {
            background: rgba(245, 158, 11, 0.18);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.35);
        }

        .badge-label {
            background: rgba(236, 72, 153, 0.18);
            color: #f472b6;
            border: 1px solid rgba(236, 72, 153, 0.35);
        }

        /* TAC Code View Box */
        .tac-box {
            background: #060911;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            font-family: var(--mono-font);
            font-size: 0.95rem;
            line-height: 1.7;
            color: #f1f5f9;
            overflow-x: auto;
            white-space: pre;
        }

        .tac-box .tac-label {
            color: #f472b6;
            font-weight: 600;
        }

        .tac-box .tac-temp {
            color: #fbbf24;
        }

        .tac-box .tac-kw {
            color: #38bdf8;
            font-weight: 600;
        }

        .tac-box .tac-op {
            color: #818cf8;
        }

        /* Postfix Cards Grid */
        .postfix-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
        }

        .postfix-item {
            background: #070b14;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 1rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .postfix-infix {
            color: #94a3b8;
            font-size: 0.85rem;
            font-family: var(--mono-font);
        }

        .postfix-rpn {
            color: #2dd4bf;
            font-size: 1.05rem;
            font-weight: 600;
            font-family: var(--mono-font);
            letter-spacing: 0.04em;
        }
    </style>
</head>
<body>
    <main>
        <div class="header">
            <h1>Compilador Go</h1>
            <p class="subtitle">Analizador léxico, sintáctico, semántico y generador de código intermedio (IR - Unidad 2)</p>
        </div>

        <div class="glass-panel">
            <div class="editor-wrapper">
                <div class="editor-container">
                    <div class="line-numbers" id="line-numbers">1</div>
                    <textarea id="code-input" placeholder="Escribe o pega código de Go aquí..." spellcheck="false"></textarea>
                </div>
            </div>

            <div class="button-group">
                <button id="analyze-btn" onclick="analyzeCode()">
                    <div class="spinner" id="lex-spinner"></div>
                    <span id="btn-text">Análisis léxico</span>
                </button>
                <button id="parse-btn" class="secondary-btn" onclick="analyzeSyntax()">
                    <div class="spinner" id="parse-spinner"></div>
                    <span id="parse-btn-text">Análisis sintáctico</span>
                </button>
                <button id="semantic-btn" class="semantic-btn" onclick="analyzeSemantic()">
                    <div class="spinner" id="semantic-spinner"></div>
                    <span id="semantic-btn-text">Análisis semántico</span>
                </button>
                <button id="ir-btn" class="ir-btn" onclick="analyzeIR()">
                    <div class="spinner" id="ir-spinner"></div>
                    <span id="ir-btn-text">Código intermedio (IR)</span>
                </button>
                <button id="clear-btn" class="outline-btn" onclick="clearEditor()" title="Limpiar código">
                    Limpiar
                </button>
            </div>
        </div>

        <div id="error-container"></div>
        <div id="parse-result-container"></div>
        <div id="semantic-result-container"></div>
        <div id="ir-result-container"></div>

        <!-- Tabla de Tokens -->
        <div id="results-section" class="glass-panel">
            <div class="table-header-bar">
                <span class="table-title">Tokens identificados</span>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Lexema</th>
                            <th>Tipo de Token</th>
                            <th>Valor de Atributo</th>
                        </tr>
                    </thead>
                    <tbody id="results-body">
                        <!-- Tokens inyectados dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Tabla de Símbolos Semánticos -->
        <div id="symbols-section" class="glass-panel">
            <div class="table-header-bar">
                <span class="table-title">Tabla de símbolos</span>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Identificador</th>
                            <th>Tipo</th>
                            <th>Ámbito</th>
                            <th>Línea</th>
                        </tr>
                    </thead>
                    <tbody id="symbols-body">
                        <!-- Símbolos inyectados dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const textarea = document.getElementById('code-input');
        const lineNumbers = document.getElementById('line-numbers');

        function updateLineNumbers() {
            const lines = (textarea.value || '').split('\n').length;
            let numbersText = '';
            for (let i = 1; i <= Math.max(lines, 1); i++) {
                numbersText += i + '\n';
            }
            lineNumbers.textContent = numbersText;
        }

        function syncScroll() {
            lineNumbers.scrollTop = textarea.scrollTop;
        }

        textarea.addEventListener('input', updateLineNumbers);
        textarea.addEventListener('scroll', syncScroll);

        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
                updateLineNumbers();
            } else if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                analyzeSyntax();
            }
        });

        // Inicializar números de línea
        updateLineNumbers();

        // Inicializar Mermaid
        if (window.mermaid) {
            mermaid.initialize({
                startOnLoad: false,
                theme: 'dark',
                securityLevel: 'loose',
                flowchart: {
                    curve: 'basis',
                    useMaxWidth: false,
                    htmlLabels: true
                }
            });
        }

        function clearEditor() {
            textarea.value = '';
            updateLineNumbers();
            hideAllResults();
        }

        function hideAllResults() {
            document.getElementById('error-container').style.display = 'none';
            document.getElementById('results-section').style.display = 'none';
            document.getElementById('symbols-section').style.display = 'none';
            document.getElementById('parse-result-container').style.display = 'none';
            document.getElementById('semantic-result-container').style.display = 'none';
            document.getElementById('ir-result-container').style.display = 'none';
            document.getElementById('results-body').innerHTML = '';
            document.getElementById('symbols-body').innerHTML = '';
        }

        function classifyToken(tokenName) {
            const name = (tokenName || '').toUpperCase();
            if (name === 'OPAR') return 'badge-opar';
            if (name === 'OPREL') return 'badge-oprel';
            if (name === 'TYPE') return 'badge-type';
            if (name === 'ID') return 'badge-id';
            if (['INT_LIT', 'FLOAT_LIT', 'STRING_LIT'].includes(name)) return 'badge-literal';
            if (['PACKAGE', 'IMPORT', 'FUNC', 'VAR', 'CONST', 'STRUCT', 'IF', 'ELSE', 'FOR', 'RETURN', 'TRUE', 'FALSE', 'NIL', 'TYPE_KW'].includes(name) || tokenName === 'type') return 'badge-keyword';
            if (['ASIGN', 'ASIGN_CORTA', 'ASSIGN', 'ASSIGN_DEF', 'AND', 'OR', 'INC', 'DEC', 'ADD_ASSIGN', 'SUB_ASSIGN', 'MUL_ASSIGN', 'DIV_ASSIGN'].includes(name)) return 'badge-operator';
            if (['DELIMITADOR', '(', ')', '{', '}', '[', ']', ',', ';', ':', '.', '!'].includes(tokenName) || name === 'DELIMITADOR') return 'badge-delimiter';
            return 'badge-keyword';
        }

        async function analyzeCode() {
            const codeInput = textarea.value;
            const analyzeBtn = document.getElementById('analyze-btn');
            
            if (!codeInput.trim()) {
                showError("El bloque de código no puede estar vacío.");
                return;
            }

            hideAllResults();
            analyzeBtn.classList.add('loading');
            document.getElementById('btn-text').textContent = 'Analizando...';

            try {
                const response = await fetch('/tokenize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: codeInput })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "Error al comunicarse con el servidor");
                }

                const data = await response.json();
                
                if (data.errors && data.errors.length > 0) {
                    showError("<b>Errores léxicos detectados:</b><br>" + data.errors.map(escapeHtml).join('<br>'));
                }

                if (data.tokens && data.tokens.length > 0) {
                    const resultsBody = document.getElementById('results-body');
                    data.tokens.forEach(token => {
                        const row = document.createElement('tr');
                        const badgeClass = classifyToken(token.token_name);
                        row.innerHTML = `
                            <td>${escapeHtml(token.lexeme)}</td>
                            <td><span class="token-badge ${badgeClass}">${escapeHtml(token.token_name)}</span></td>
                            <td>${escapeHtml(token.attribute_value)}</td>
                        `;
                        resultsBody.appendChild(row);
                    });
                    document.getElementById('results-section').style.display = 'block';
                } else if (!data.errors || data.errors.length === 0) {
                    showError("No se encontraron tokens válidos en el código.");
                }
            } catch (error) {
                showError(error.message);
            } finally {
                analyzeBtn.classList.remove('loading');
                document.getElementById('btn-text').textContent = 'Análisis léxico';
            }
        }

        async function analyzeSyntax() {
            const codeInput = textarea.value;
            const parseBtn = document.getElementById('parse-btn');
            
            if (!codeInput.trim()) {
                showError("El bloque de código no puede estar vacío.");
                return;
            }

            hideAllResults();
            parseBtn.classList.add('loading');
            document.getElementById('parse-btn-text').textContent = 'Analizando...';

            try {
                const response = await fetch('/parse', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: codeInput })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "Error al comunicarse con el servidor");
                }

                const data = await response.json();
                await displaySyntaxResult(data, codeInput);
                
            } catch (error) {
                showError(error.message);
            } finally {
                parseBtn.classList.remove('loading');
                document.getElementById('parse-btn-text').textContent = 'Análisis sintáctico';
            }
        }

        async function analyzeSemantic() {
            const codeInput = textarea.value;
            const semanticBtn = document.getElementById('semantic-btn');
            
            if (!codeInput.trim()) {
                showError("El bloque de código no puede estar vacío.");
                return;
            }

            hideAllResults();
            semanticBtn.classList.add('loading');
            document.getElementById('semantic-btn-text').textContent = 'Analizando...';

            try {
                const response = await fetch('/semantic', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: codeInput })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "Error al comunicarse con el servidor");
                }

                const data = await response.json();
                displaySemanticResult(data);
                
            } catch (error) {
                showError(error.message);
            } finally {
                semanticBtn.classList.remove('loading');
                document.getElementById('semantic-btn-text').textContent = 'Análisis semántico';
            }
        }

        async function analyzeIR() {
            const codeInput = textarea.value;
            const irBtn = document.getElementById('ir-btn');
            
            if (!codeInput.trim()) {
                showError("El bloque de código no puede estar vacío.");
                return;
            }

            hideAllResults();
            irBtn.classList.add('loading');
            document.getElementById('ir-btn-text').textContent = 'Generando...';

            try {
                const response = await fetch('/ir', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: codeInput })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || "Error al comunicarse con el servidor");
                }

                const data = await response.json();
                displayIRResult(data);
                
            } catch (error) {
                showError(error.message);
            } finally {
                irBtn.classList.remove('loading');
                document.getElementById('ir-btn-text').textContent = 'Código intermedio (IR)';
            }
        }

        async function displaySyntaxResult(data, originalCode) {
            const container = document.getElementById('parse-result-container');
            container.style.display = 'flex';
            container.innerHTML = '';
            
            if (data.success) {
                const successDiv = document.createElement('div');
                successDiv.className = 'success-card';
                successDiv.innerHTML = `
                    <h3>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
                        Sintaxis correcta
                    </h3>
                    <p style="margin:0; color:#cbd5e1;">El bloque de código introducido es estructuralmente válido.</p>
                `;
                container.appendChild(successDiv);

                if (data.ast_mermaid) {
                    const astCard = document.createElement('div');
                    astCard.className = 'ast-card';
                    astCard.innerHTML = `
                        <div class="section-header-bar">
                            <div class="section-title">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00add8" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
                                Árbol sintáctico
                            </div>
                        </div>
                        <div class="ast-viewport">
                            <div id="mermaid-render-area"></div>
                        </div>
                    `;
                    container.appendChild(astCard);

                    if (window.mermaid) {
                        try {
                            const renderArea = document.getElementById('mermaid-render-area');
                            const uniqueId = 'mermaid-graph-' + Date.now();
                            const { svg } = await mermaid.render(uniqueId, data.ast_mermaid);
                            renderArea.innerHTML = svg;
                        } catch (err) {
                            console.error("Error al renderizar Mermaid:", err);
                        }
                    }
                }
            } else {
                let codeSnippetHtml = '';
                if (data.error_line !== null && data.error_index !== null) {
                    const lines = originalCode.split('\n');
                    const errLineText = lines[data.error_line - 1] || '';
                    
                    let absIndex = data.error_index;
                    let currentIdx = 0;
                    let col = 0;
                    for (let i = 0; i < lines.length; i++) {
                        if (currentIdx + lines[i].length >= absIndex) {
                            col = absIndex - currentIdx;
                            break;
                        }
                        currentIdx += lines[i].length + 1;
                    }
                    
                    let errTokenLength = 1;
                    const match = (data.error_message || '').match(/cerca de '([^']+)'/);
                    if (match && match[1]) {
                        errTokenLength = Math.max(match[1].length, 1);
                    }

                    const before = errLineText.substring(0, col);
                    const errToken = errLineText.substring(col, col + errTokenLength) || ' ';
                    const after = errLineText.substring(col + errToken.length);
                    
                    codeSnippetHtml = `
                        <div class="code-snippet">
                            <div class="line-number">Línea ${data.error_line}</div>
                            <div class="code-line">${escapeHtml(before)}<mark class="error-highlight">${escapeHtml(errToken)}</mark>${escapeHtml(after)}</div>
                        </div>
                    `;
                }

                container.innerHTML = `
                    <div class="error-card">
                        <h3>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            Error de sintaxis
                        </h3>
                        <p style="margin:0; color:#cbd5e1;">${escapeHtml(data.error_message)}</p>
                        ${codeSnippetHtml}
                    </div>
                `;
            }
        }

        function displaySemanticResult(data) {
            const container = document.getElementById('semantic-result-container');
            container.style.display = 'flex';
            container.innerHTML = '';
            
            if (data.success) {
                const successDiv = document.createElement('div');
                successDiv.className = 'success-card';
                successDiv.innerHTML = `
                    <h3>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
                        Semántica correcta
                    </h3>
                    <p style="margin:0; color:#cbd5e1;">No se encontraron errores de tipo, redeclaración ni variables no declaradas.</p>
                `;
                container.appendChild(successDiv);

                if (data.symbols && data.symbols.length > 0) {
                    const symbolsBody = document.getElementById('symbols-body');
                    symbolsBody.innerHTML = '';
                    data.symbols.forEach(sym => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td style="font-weight: 600; color: #ffffff;">${escapeHtml(sym.name)}</td>
                            <td><span class="token-badge badge-type">${escapeHtml(sym.data_type)}</span></td>
                            <td><span class="token-badge badge-scope">${escapeHtml(sym.scope)}</span></td>
                            <td style="color: #94a3b8; font-family: var(--mono-font);">${sym.line !== null && sym.line !== undefined ? sym.line : '-'}</td>
                        `;
                        symbolsBody.appendChild(row);
                    });
                    document.getElementById('symbols-section').style.display = 'block';
                }
            } else {
                let errorItemsHtml = '';
                if (data.errors && data.errors.length > 0) {
                    errorItemsHtml = `<ul class="error-list">` + data.errors.map(err => `<li>${escapeHtml(err)}</li>`).join('') + `</ul>`;
                }

                container.innerHTML = `
                    <div class="error-card">
                        <h3>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            Error semántico detectado
                        </h3>
                        <p style="margin:0; color:#cbd5e1;">Se encontraron errores semánticos en las declaraciones o uso de identificadores:</p>
                        ${errorItemsHtml}
                    </div>
                `;
            }
        }

        function highlightTac(code) {
            return escapeHtml(code)
                .replace(/\b(func|endfunc|goto|ifFalse|ifTrue|param|call|return)\b/g, '<span class="tac-kw">$1</span>')
                .replace(/\b(L\d+):/g, '<span class="tac-label">$1:</span>')
                .replace(/\b(L\d+)\b/g, '<span class="tac-label">$1</span>')
                .replace(/\b(t\d+)\b/g, '<span class="tac-temp">$1</span>');
        }

        function displayIRResult(data) {
            const container = document.getElementById('ir-result-container');
            container.style.display = 'flex';
            container.innerHTML = '';

            if (data.success) {
                const successDiv = document.createElement('div');
                successDiv.className = 'success-card';
                successDiv.innerHTML = `
                    <h3>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
                        Código intermedio generado exitosamente (IR - Unidad 2)
                    </h3>
                    <p style="margin:0; color:#cbd5e1;">Se ha generado la representación intermedia en formatos: Código de Tres Direcciones (TAC), Cuádruplos/Triplos y Notación Postfija.</p>
                `;
                container.appendChild(successDiv);

                // 1. Panel de Código de Tres Direcciones (TAC)
                const tacCard = document.createElement('div');
                tacCard.className = 'ir-card';
                tacCard.innerHTML = `
                    <div class="section-header-bar">
                        <div class="section-title">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            Código de tres direcciones (TAC)
                        </div>
                    </div>
                    <div class="tac-box">${highlightTac(data.tac_code || '')}</div>
                `;
                container.appendChild(tacCard);

                // 2. Tabla de Cuádruplos y Triplos
                if (data.quadruples && data.quadruples.length > 0) {
                    const quadsCard = document.createElement('div');
                    quadsCard.className = 'ir-card';
                    
                    let rowsHtml = '';
                    data.quadruples.forEach(q => {
                        let opBadge = `<span class="token-badge badge-operator">${escapeHtml(q.op)}</span>`;
                        let resBadge = q.result.startsWith('t') ? `<span class="token-badge badge-temp">${escapeHtml(q.result)}</span>` : 
                                      (q.result.startsWith('L') ? `<span class="token-badge badge-label">${escapeHtml(q.result)}</span>` : escapeHtml(q.result));
                        
                        rowsHtml += `
                            <tr>
                                <td style="color: #94a3b8; font-weight: 600;">#${q.index}</td>
                                <td>${opBadge}</td>
                                <td>${escapeHtml(q.arg1 || '-')}</td>
                                <td>${escapeHtml(q.arg2 || '-')}</td>
                                <td>${resBadge || '-'}</td>
                            </tr>
                        `;
                    });

                    quadsCard.innerHTML = `
                        <div class="section-header-bar">
                            <div class="section-title">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00add8" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"/></svg>
                                Tabla de cuádruplos y triplos (#, op, arg1, arg2, res)
                            </div>
                        </div>
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Operador</th>
                                        <th>Argumento 1</th>
                                        <th>Argumento 2</th>
                                        <th>Resultado</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rowsHtml}
                                </tbody>
                            </table>
                        </div>
                    `;
                    container.appendChild(quadsCard);
                }

                // 3. Panel de Notación Postfija (RPN)
                if (data.postfix_expressions && data.postfix_expressions.length > 0) {
                    const postCard = document.createElement('div');
                    postCard.className = 'ir-card';
                    
                    let postGridHtml = '';
                    data.postfix_expressions.forEach(p => {
                        postGridHtml += `
                            <div class="postfix-item">
                                <span class="postfix-infix">Infija: ${escapeHtml(p.infix)}</span>
                                <span class="postfix-rpn">Postfija: ${escapeHtml(p.postfix)}</span>
                            </div>
                        `;
                    });

                    postCard.innerHTML = `
                        <div class="section-header-bar">
                            <div class="section-title">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                                Notación postfija (Recorrido postorden del AST)
                            </div>
                        </div>
                        <div class="postfix-grid">
                            ${postGridHtml}
                        </div>
                    `;
                    container.appendChild(postCard);
                }

            } else {
                let errorItemsHtml = '';
                if (data.errors && data.errors.length > 0) {
                    errorItemsHtml = `<ul class="error-list">` + data.errors.map(err => `<li>${escapeHtml(err)}</li>`).join('') + `</ul>`;
                }

                container.innerHTML = `
                    <div class="error-card">
                        <h3>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                            No se pudo generar el código intermedio
                        </h3>
                        <p style="margin:0; color:#cbd5e1;">El código presenta inconsistencias que deben corregirse antes de generar la representación intermedia:</p>
                        ${errorItemsHtml}
                    </div>
                `;
            }
        }

        function showError(message) {
             const errorContainer = document.getElementById('error-container');
             errorContainer.innerHTML = message;
             errorContainer.style.display = 'block';
        }

        function escapeHtml(unsafe) {
            return (unsafe || '').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
